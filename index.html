<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REALME">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>REALME Incentives</title>
<style>
:root{
  --paper:#F4F5F7; --sheet:#FFFFFF; --ink:#17202B; --ink2:#3A4452; --mute:#69727F; --line:#E4E7EC;
  --yel:#FFC915; --yel2:#FFF6D6; --green:#1E7F53; --red:#C2362B; --redbg:#FCEDEB;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,"PingFang SC","Noto Sans SC","Microsoft YaHei",Tahoma,sans-serif;
  font-size:15px;line-height:1.45}
:lang(zh) body,:lang(zh) button,:lang(zh) input,:lang(zh) select{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei","IBM Plex Sans Arabic",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
span.num{white-space:nowrap}
/* الأرقام اتجاهها LTR — نثبّت محاذاتها حسب لغة الصفحة */
[dir=rtl] .num{text-align:right}
[dir=rtl] .r.num,[dir=rtl] .bal .num,[dir=rtl] .doc .a .num{text-align:left}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* language picker */
.lang{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:600;min-width:0}

/* ---------- login ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px}
#login .ltop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lwrap{flex:1;display:flex;align-items:center;justify-content:center}
.lbox{width:100%;max-width:360px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.mark{min-width:48px;height:48px;padding:0 12px;border-radius:12px;background:var(--yel);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.8px;color:var(--ink);flex:none}
.brand h1{margin:0;font-size:22px;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--mute);font-size:13px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
input[type=text],input[type=password],input[type=search],input[type=date],select.in{
  width:100%;padding:12px 14px;border:1px solid #CDD2DA;border-radius:10px;background:var(--sheet);outline:none;font-size:16px}
input:focus,select.in:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,32,43,.08)}
.chk{display:flex;gap:10px;align-items:center;margin:16px 0 0;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;margin-top:20px}
.btn:disabled{opacity:.55}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:20px;margin-top:12px}

/* ---------- app shell ---------- */
header{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--line);
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto}
.hrow .mark{min-width:34px;height:34px;padding:0 8px;border-radius:9px;font-size:10.5px}
.hrow h2{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink2);flex:none;padding:0}
.ib svg{width:17px;height:17px}
.upd{font-size:12px;color:var(--mute);max-width:900px;margin:4px auto 0}
main{padding:14px 16px 48px;max-width:900px;margin:0 auto}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.banner.chg{background:var(--yel2);color:#6B5200}
.banner.off{background:var(--redbg);color:var(--red);font-weight:600}

/* ---------- list ---------- */
.overview{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;margin:4px 0 16px}
.overview .main{flex:1 1 220px}
.overview .lbl{font-size:13px;color:var(--mute);display:block}
.overview .big{font-size:30px;font-weight:700;line-height:1.15}
.overview .sm{display:flex;gap:22px}
.overview .sm b{display:block;font-size:16px;font-weight:600}
.overview .sm .warn b{color:var(--red)}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters input{flex:2;min-width:0}
.filters select{flex:1;min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.store{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;text-align:start}
.store:first-child{border-top:0}
.store:hover{background:#FAFBFC}
.store .who{flex:1;min-width:0}
.store .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store .mt{font-size:12.5px;color:var(--mute);margin-top:1px;display:flex;flex-wrap:wrap;gap:2px 12px}
.store .bal{text-align:end;white-space:nowrap}
.store .bal b{font-size:16px;font-weight:700;display:block}
.store .bal span{font-size:12px;color:var(--mute)}
.store .bal b.neg{color:var(--red)}
.store .dot{width:8px;height:8px;border-radius:50%;background:var(--yel);flex:none}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px}
.tag.r{background:var(--redbg);color:var(--red)}
.chev{width:16px;height:16px;color:#B5BCC6;flex:none}
[dir=rtl] .chev{transform:scaleX(-1)}
.empty{text-align:center;color:var(--mute);padding:40px 16px}

/* ---------- store ---------- */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--ink2);font-weight:600;padding:2px 0 12px;font-size:14px}
.back svg{width:18px;height:18px}
[dir=rtl] .back svg{transform:scaleX(-1)}
.paper{background:var(--redbg);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:600;margin-bottom:10px;font-size:14px}
.hero{background:var(--yel);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:6px}
.hero h3{margin:0;font-size:18px;line-height:1.3}
.hero .meta{font-size:13px;color:#5A4A12;margin-top:2px}
.hero .lbl{font-size:13px;margin-top:14px;color:#4A3D0E}
.hero .big{font-size:34px;font-weight:700;line-height:1.1}
.hero .big.neg{color:#9E2318}
.hero .parts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(23,32,43,.15);font-size:13px}
.hero .parts b{display:block;font-size:15px;font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px 9px;color:var(--mute);font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--yel)}
.tabs .cnt{font-size:11px;background:#E9ECF0;border-radius:999px;padding:0 6px;margin-inline-start:5px;color:var(--ink2)}
.tabs .cnt:empty{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid #CDD2DA;background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--ink2)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.range{display:flex;gap:8px;margin-bottom:12px}
.range>div{flex:1}
.range label.f{margin-top:0}

/* totals line above tables */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.totals div{background:var(--sheet);padding:10px 12px}
.totals span{display:block;font-size:12px;color:var(--mute)}
.totals b{font-size:16px;font-weight:600}
.totals .key{background:var(--yel2)}
.totals .key b{font-weight:700}

/* tables */
.tbl{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--mute);padding:10px 10px 8px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-top:1px solid #EEF0F3;vertical-align:middle;text-align:start}
.tbl tr:first-child td{border-top:0}
.tbl th.r,.tbl td.r{text-align:end}
.tbl td.k{font-weight:500;white-space:nowrap}
.tbl td.n{color:var(--mute);font-size:12.5px}
.tbl tr.edge td{background:#F8F9FA;color:var(--ink2)}
.tbl tr.last td{background:var(--yel2);font-weight:700;border-top:1px solid var(--line)}
.tbl .dash{color:#C5CBD3}
.tbl tbody td:first-child{white-space:nowrap}
.plus{color:var(--green)}.minus{color:var(--red)}
@media (max-width:560px){.tbl .hn{display:none}.tbl table{font-size:13px}.tbl td,.tbl th{padding:9px 6px}}
.foot{margin-top:10px;color:var(--mute);font-size:12.5px}

/* orders */
.doc{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.doc+.doc{margin-top:8px}
.doc .dh{display:flex;justify-content:space-between;gap:10px}
.doc .k{font-weight:600}
.doc .d{font-size:12.5px;color:var(--mute)}
.doc .a{text-align:end;white-space:nowrap}
.doc .a b{font-size:15px}
.doc .items{margin-top:8px;border-top:1px solid #EEF0F3;padding-top:6px}
.doc .it{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;color:var(--ink2)}
.doc .it .c{color:var(--mute)}
.kind{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;margin-inline-end:6px}
.kind.o{background:#E6F2EC;color:var(--green)}
.kind.rt{background:var(--redbg);color:var(--red)}

/* files (invoices + docs) */
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.file .ic{width:40px;height:40px;border-radius:9px;background:var(--paper);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2);flex:none}
.file .tt{flex:1;min-width:0}
.file .tt b{display:block;font-weight:600}
.file .tt span{font-size:12.5px;color:var(--mute)}
.sbtn{border:1px solid #CDD2DA;background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-grid;place-items:center}
.sbtn.del{color:var(--red);border-color:#F0C9C4;padding:7px 10px}
.sbtn:disabled{opacity:.5}
.paper-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.paper-row:first-child{border-top:0}
.paper-row .tt{flex:1;min-width:0}
.paper-row .tt b{display:block;font-weight:600}
.paper-row .tt span{font-size:12.5px;color:var(--mute)}
.orig{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.orig.ok{background:#E6F2EC;color:var(--green)}
.orig.no{background:#F1F2F4;color:var(--mute)}
.vat{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;background:rgba(23,32,43,.1)}
.vat.bad{background:#9E2318;color:#fff}
.tplbtn{display:flex;align-items:center;gap:6px;width:100%;justify-content:center;border:1px dashed #B9C0CA;background:var(--sheet);
  border-radius:var(--r);padding:10px;font-weight:600;color:var(--ink2);margin-bottom:12px}
#tplBox{margin:-4px 0 14px}
.ledbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
/* ---- كشف الحساب للطباعة ---- */
.st{color:#1d1d1f;font-size:9.5pt;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.st .num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.st-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:10px;border-bottom:3px solid #FFC915}
.st-brand{display:flex;align-items:center;gap:10px}
.st-logo{min-width:42px;height:42px;padding:0 10px;border-radius:9px;background:#FFC915;color:#1d1d1f;display:grid;place-items:center;font-weight:800;font-size:11pt;letter-spacing:.8px}
.st-brand b{display:block;font-size:13pt}
.st-brand span{display:block;font-size:8.5pt;color:#6b6b6b}
.st-title{text-align:end}
.st-title h1{margin:0;font-size:16pt;font-weight:700}
.st-title span{font-size:8.5pt;color:#6b6b6b}
.st-mer{margin:12px 0 10px;text-align:center}
.st-mer>b{font-size:14pt}
.st-mer>.num{font-size:11pt;color:#555}
.st-mer>span:not(.num){display:inline-block;margin:4px 10px 0;font-size:8.5pt;color:#6b6b6b}
.st td.nt{font-size:8pt;color:#555;max-width:170px}
.st tr.used td{color:#8a8a8a}
.st td.neg{color:#b3261e}
.st-low{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:14px;break-inside:avoid}
.st-cat{font-size:8.6pt}
.st-cat th{background:#f2f2f2!important;color:#1d1d1f!important}
.st-cat tr.tot td{background:#26292e!important}
.st-box{display:grid;gap:0;border:1px solid #d9d9d9;border-radius:6px;overflow:hidden;align-self:start}
.st-box div{padding:7px 10px;border-bottom:1px solid #e6e6e6}
.st-box div:last-child{border-bottom:0}
.st-box span{display:block;font-size:7.5pt;color:#6b6b6b}
.st-box b{font-size:12pt}
.st-box small{display:block;font-size:7.5pt;color:#8a6d00;font-weight:600}
.st-box .end{background:#FFF4CC}
.st-info{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0;border:1px solid #d9d9d9;border-radius:6px;overflow:hidden}
.st-info div{padding:6px 10px;border-inline-end:1px solid #e6e6e6;border-bottom:1px solid #e6e6e6}
.st-info div:nth-child(3n){border-inline-end:0}
.st-info div:nth-last-child(-n+3){border-bottom:0}
.st-info span{display:block;font-size:7.5pt;color:#6b6b6b}
.st-info b{font-size:10pt;font-weight:600}
.st-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-bottom:12px;border:1px solid #d9d9d9;border-radius:6px;overflow:hidden}
.st-sum div{padding:7px 10px;border-inline-end:1px solid #e6e6e6}
.st-sum div:last-child{border-inline-end:0}
.st-sum span{display:block;font-size:7.5pt;color:#6b6b6b}
.st-sum b{font-size:11pt}
.st-sum .end{background:#FFF4CC}
.st-sum .end small{display:block;font-size:7.5pt;font-weight:600;color:#8a6d00}
.st table{width:100%;border-collapse:collapse;font-size:8.8pt}
.st thead{display:table-header-group}
.st th{background:#26292e;color:#fff;font-weight:600;padding:6px 6px;text-align:start;white-space:nowrap}
.st th.r,.st td.r{text-align:end}
.st td{padding:5px 6px;border-bottom:1px solid #ececec;vertical-align:top}
.st td.num{white-space:nowrap}
.st tbody tr:nth-child(even) td{background:#fafafa}
.st tr{break-inside:avoid}
.st td.dr{color:#b3261e}.st td.cr{color:#1e7b45}
.st td.ibal{color:#8a6d00}
.st td.mut{color:#9a9a9a}
.st tr.open td{background:#f2f2f2!important;font-weight:600}
.st tr.tot td{background:#26292e!important;color:#fff;font-weight:700;border:0}
.st td small{display:block;color:#7a7a7a;font-size:7.8pt}
.st-notes{margin-top:12px;font-size:8pt;color:#555}
.st-notes b{color:#1d1d1f}
.st-notes p{margin:2px 0}
.st-sig{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px;break-inside:avoid}
.st-sig div{border-top:1px solid #999;padding-top:5px;font-size:8.5pt;color:#555;text-align:center}
.st-foot{margin-top:16px;padding-top:6px;border-top:1px solid #e6e6e6;display:flex;justify-content:space-between;font-size:7.5pt;color:#9a9a9a}
.ledhead{margin-bottom:10px}
.ledhead b{font-size:16px}
.ledhead span{display:block;font-size:12.5px;color:var(--mute)}
.ledhead span b{font-size:14px;color:var(--ink)}
.incsum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:-4px 0 12px;padding:9px 12px;border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--mute)}
.incsum>b{color:var(--ink);font-size:13px}
.incsum span b{color:var(--ink);margin-inline-start:3px}
#ledger tr.info td{color:var(--mute);background:transparent}
#ledger td.k small{display:block;font-size:11px;color:var(--mute);font-weight:400}
#ledger td.k small.incb{color:#8a6d00;font-weight:600}
#ledger .tbl table{font-size:12.5px}
#ledger .tbl td,#ledger .tbl th{padding:8px 5px}
#ledger .tbl tbody td:first-child{font-size:11.5px}
#ledPrint{display:none}

/* ==================== شكل جديد (تحديث 14) ==================== */
:root{--paper:#EDEFF2;--night:#0F1318;--night2:#1A2029;--steel:#8A94A3;--yel:#FFC915;--ink:#12171E}
body{background:var(--paper)}
header{background:var(--night);border-bottom:0;color:#fff}
header .hrow h2{color:#fff}
header .ib{border-color:rgba(255,255,255,.18);color:#E8ECF1}
header .lang{background:transparent;border-color:rgba(255,255,255,.18);color:#fff}
header .lang option{color:#111}
.upd{color:#8D97A6}
#vlist main,#vlist{position:relative}
/* اللوحة الغامقة بتكمّل الهيدر */
.overview{display:block;background:linear-gradient(180deg,var(--night) 0,var(--night2) 100%);color:#fff;border-radius:0 0 22px 22px;
  margin:-14px -16px 14px;padding:18px 18px 16px;position:relative;overflow:hidden}
.overview::after{content:"";position:absolute;inset:auto -60px -90px auto;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,201,21,.22),rgba(255,201,21,0) 70%);pointer-events:none}
[dir=rtl] .overview::after{inset:auto auto -90px -60px}
.ov-top{display:flex;align-items:center;gap:14px}
.overview .main{flex:1;min-width:0}
.ov-hi{display:block;font-size:13px;color:#AAB3C0;margin-bottom:6px}
.overview .lbl{color:#AAB3C0}
.overview .big{font-size:clamp(30px,8.5vw,44px);font-weight:700;letter-spacing:-.5px;color:var(--yel);line-height:1.08;margin-top:2px}
.overview .big.neg{color:#FF8A7A}
.ov-ring{width:84px;height:84px;position:relative;flex:none}
.ov-ring svg{width:84px;height:84px}
.rg-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:8}
.rg-fg{fill:none;stroke:var(--yel);stroke-width:8;stroke-linecap:round;transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.rg-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.rg-t b{font-size:17px}.rg-t span{font-size:10.5px;color:#AAB3C0}
.ov-bar{position:relative;display:flex;height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:16px 0 8px}
.ov-bar i{display:block;height:100%;width:var(--w);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ov-bar .b-op{background:#5D6878}.ov-bar .b-in{background:var(--yel)}
.ov-bar em{position:absolute;top:0;bottom:0;inset-inline-start:0;width:var(--w);border-inline-end:2px solid #fff;
  background:repeating-linear-gradient(135deg,rgba(15,19,24,.55) 0 4px,rgba(15,19,24,.15) 4px 8px);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ov-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:#AAB3C0}
.ov-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.ov-legend .b-op{background:#5D6878}.ov-legend .b-in{background:var(--yel)}
.ov-legend .b-us{background:repeating-linear-gradient(135deg,#fff 0 2px,transparent 2px 4px);border:1px solid #fff}
.ov-legend b{color:#fff;font-weight:600}
.overview .kpis{display:grid!important;grid-template-columns:repeat(4,1fr);gap:1px!important;margin-top:14px;background:rgba(255,255,255,.08);border-radius:14px;overflow:hidden}
.kpis>div{background:rgba(15,19,24,.55);padding:10px 12px;min-width:0}
.kpis .lbl{font-size:11.5px}
.kpis b{display:block;font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.overview .kpis{grid-template-columns:repeat(2,1fr)}}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.alerts:not(:has(.pill:not(.hide))){display:none}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#E6EAF0;
  border-radius:999px;padding:5px 12px 5px 6px;font-size:12.5px;font-weight:600;transition:background .2s,border-color .2s}
[dir=rtl] .pill{padding:5px 6px 5px 12px}
.pill b{min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:12px;padding:0 6px}
.pill.warn b{background:#C2362B;color:#fff}
.pill.on{background:var(--yel);border-color:var(--yel);color:var(--night)}
.pill.on b{background:var(--night);color:#fff}
/* كروت التحليل */
.insights{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:700px){.insights{grid-template-columns:1fr}}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.wide{grid-column:1/-1}
.card header{all:unset;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.card h4{margin:0;font-size:13.5px;font-weight:700;color:var(--ink2)}
.card .sub{font-size:13px;white-space:nowrap}.card .sub b{font-size:16px}
.card .up{color:var(--green);font-weight:700;font-size:12px}.card .dn{color:var(--red);font-weight:700;font-size:12px}
.nodata{color:var(--mute);font-size:13px;text-align:center;padding:26px 0}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.bc .bv{font-size:10.5px;color:var(--mute);height:14px}
.bc .bt{flex:1;width:100%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.bc .bt i{display:block;height:var(--h);min-height:2px;background:#CDD3DB;border-radius:6px 6px 2px 2px;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.bc .bt s{display:block;height:var(--h);background:#F2B8B0;border-radius:2px;text-decoration:none;max-height:40%}
.bc.cur .bt i{background:var(--yel)}
.bc.cur .bv{color:var(--ink);font-weight:700}
.bc .bl{font-size:11px;color:var(--mute);white-space:nowrap}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hb,.rg{position:relative;display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 2px;text-align:start;border-top:1px solid #F0F2F5;isolation:isolate}
.hb:first-child,.rg:first-child{border-top:0}
.hb i,.rg i{position:absolute;inset-inline-start:0;bottom:3px;height:3px;width:var(--w);background:var(--yel);border-radius:3px;opacity:.85;
  transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hb .hr{width:22px;height:22px;border-radius:7px;background:var(--night);color:var(--yel);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.hb .hn,.rg .rn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13.5px}
.hb b,.rg b{font-size:13.5px}.hb b.neg{color:var(--red)}
.rg .rc{font-size:12px;color:var(--mute);white-space:nowrap}
.hb:hover,.rg:hover{background:#FAFBFC}
/* الفلاتر والقايمة */
.filters{flex-wrap:wrap}
.filters input{flex:1 1 100%}
.filters select{flex:1 1 140px}
@media (min-width:640px){.filters input{flex:2 1 220px}}
.chips.lf{margin-bottom:12px}
.sheet#list{background:transparent;border:0;border-radius:0;overflow:visible;display:grid;gap:8px}
.store{background:var(--sheet);border:1px solid var(--line)!important;border-radius:14px;position:relative;overflow:hidden;padding:13px 14px 15px;
  transition:transform .15s,box-shadow .15s,border-color .15s}
.store::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--yel)}
.store.bad::before{background:var(--red)}
.store.ng .bal b{color:var(--red)}
.store::after{content:"";position:absolute;inset-inline-start:14px;bottom:7px;height:3px;width:calc((100% - 28px) * var(--w) / 100);
  max-width:calc(100% - 28px);background:linear-gradient(90deg,var(--yel),#FFE07A);border-radius:3px;opacity:.75}
.store.ng::after{background:#F2B8B0}
.store:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,19,24,.07);border-color:#D6DBE2!important;background:var(--sheet)}
.store .bal b{font-size:17px}
/* صفحة المحل */
.hero{background:linear-gradient(160deg,var(--night) 0,var(--night2) 70%);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:-80px -80px auto auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,201,21,.25),rgba(255,201,21,0) 70%);pointer-events:none}
[dir=rtl] .hero::after{inset:-80px auto auto -80px}
.hero h3{color:#fff;font-size:19px}
.hero .meta{color:#AAB3C0}
.hero .lbl{color:#AAB3C0}
.hero .big{color:var(--yel);font-size:clamp(32px,9vw,44px);letter-spacing:-.5px}
.hero .big.neg{color:#FF8A7A}
.hero .vat{background:rgba(255,255,255,.12);color:#fff}
.hero .vat.bad{background:#C2362B}
.useline{height:6px;border-radius:999px;background:rgba(255,255,255,.1);margin-top:14px;overflow:hidden}
.useline i{display:block;height:100%;width:var(--w,0);background:linear-gradient(90deg,var(--yel),#FFE07A);border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.usecap{font-size:11.5px;color:#AAB3C0;margin-top:5px;min-height:14px}
.hero .parts{border-top-color:rgba(255,255,255,.1)}
.hero .parts span{color:#AAB3C0}.hero .parts b{color:#fff}
.tabs button.on{border-bottom-color:var(--yel)}
.tabs button{position:relative}
/* دخول الصفحة: حركة واحدة متدرجة */
@media (prefers-reduced-motion:no-preference){
  .rv{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  .insights .rv:nth-child(1){animation-delay:.08s}.insights .rv:nth-child(2){animation-delay:.14s}.insights .rv:nth-child(3){animation-delay:.2s}
  #list .store{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 30ms + .15s)}
  #vst:not(.hide) .hero{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#banner:not(.hide) + #vlist .overview{margin-top:0;border-radius:22px}
@media (min-width:932px){.overview{margin:0 0 14px;border-radius:22px}}
/* اللوجين */
#login{background:radial-gradient(120% 70% at 50% -10%,#232B36 0,var(--night) 60%);color:#fff}
#login .brand p,#login label.f{color:#AAB3C0}
#login .lang{background:transparent;border-color:rgba(255,255,255,.2);color:#fff}
#login .lang option{color:#111}
#login input[type=text],#login input[type=password]{background:#171D25;border-color:#2B3440;color:#fff}
#login input:focus{border-color:var(--yel);box-shadow:0 0 0 3px rgba(255,201,21,.18)}
#login .btn{background:var(--yel);color:var(--night);font-weight:700}
#login .chk input{accent-color:var(--yel)}
#login .err{color:#FF8A7A}

/* ==================== حركة مع الماوس (تحديث 15) ==================== */
.glow,.glow-l{--mx:50%;--my:50%}
.glow::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;opacity:0;transition:opacity .35s;
  background:radial-gradient(420px circle at var(--mx) var(--my),rgba(255,201,21,.16),rgba(255,201,21,0) 45%)}
.glow:hover::before,.glow.act::before{opacity:1}
.glow-l{position:relative}
.glow-l::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(360px circle at var(--mx) var(--my),rgba(255,201,21,.14),rgba(255,201,21,0) 50%)}
.glow-l:hover::before{opacity:1}
.overview>*,.hero>*{position:relative;z-index:1}
.overview::after,.hero::after{transform:translate(var(--px,0),var(--py,0));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.9}
#login{position:relative;overflow:hidden}
#login>*:not(canvas){position:relative;z-index:1}
.tilt{transform-style:preserve-3d;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;will-change:transform}
.tilt.tilting{transition:transform .08s linear,box-shadow .25s;box-shadow:0 18px 40px rgba(15,19,24,.12)}
.hero.tilt.tilting{box-shadow:0 22px 48px rgba(15,19,24,.35)}
/* كروت المحلات: ضوء بيمشي مع الماوس + ميل خفيف */
.store{background-image:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,201,21,.12),rgba(255,201,21,0) 60%);
  background-repeat:no-repeat;background-size:0 0}
.store:hover{background-size:100% 100%}
/* الرسوم بتتفاعل */
.bc{cursor:default}
.bc .bt i{transition:filter .2s,transform .2s}
.bc:hover .bt i{filter:brightness(1.06) saturate(1.2);transform:scaleY(1.04)}
.bc:hover .bv{color:var(--ink);font-weight:700}
.bc:hover .bl{color:var(--ink)}
.bars:hover .bc:not(:hover) .bt i{opacity:.55}
.hb,.rg{transition:background .2s,padding .2s}
.hb:hover,.rg:hover{padding-inline-start:8px}
.hb:hover i,.rg:hover i{opacity:1;filter:saturate(1.3)}
.pill{transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s,border-color .2s}
.pill:hover{transform:translateY(-2px)}
.ov-ring svg{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.overview:hover .ov-ring svg{transform:rotate(-8deg) scale(1.04)}
#lbtn{position:relative;overflow:hidden}
#lbtn::after{content:"";position:absolute;inset:0;background:radial-gradient(120px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.45),transparent 60%);opacity:0;transition:opacity .25s}
#lbtn:hover::after{opacity:1}
@media (prefers-reduced-motion:reduce){canvas.fx{display:none}.tilt{transform:none!important}}
@media print{
  @page{size:A4;margin:12mm 11mm 14mm}
  body.print-led>*:not(#ledPrint){display:none!important}
  body.print-led #ledPrint{display:block!important}
  html:has(body.print-led),body.print-led{background:#fff!important;padding:0!important}
  body.print-led header,body.print-led .back,body.print-led .hero,body.print-led .tabs,body.print-led .chips,body.print-led .range,
  body.print-led .ledbar,body.print-led #botBtn,body.print-led #botBox,body.print-led #banner,body.print-led #spaper{display:none!important}
  body.print-led{background:#fff}
  body.print-led .tbl{border:0;overflow:visible}
}
.upbox{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.upbox h4{margin:0 0 10px;font-size:15px}
.pick{display:block;border:1.5px dashed #B9C0CA;border-radius:10px;padding:18px 12px;text-align:center;color:var(--ink2);font-weight:600;cursor:pointer;background:#FAFBFC}
.pick.has{border-style:solid;border-color:var(--green);background:#EEF7F2;color:var(--green)}
.upbox input[type=text]{margin-top:8px}
.upbox .btn{margin-top:10px}
.upbox .err{min-height:0;margin-top:8px}

.spin{width:16px;height:16px;border:2px solid #D4D9E0;border-top-color:var(--ink);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (min-width:700px){
  .hero{display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:24px}
  .hero .lbl{margin-top:0}
  .hero .bx{text-align:end}
  [dir=rtl] .hero .bx .num{text-align:left}
  .hero .parts{grid-column:1/-1}
}
</style>

<!-- ============ LOGIN ============ -->

    <div class="upd" id="upd"></div>

  <main>
    <div id="banner" class="banner hide" role="status"></div>

    <!-- list of stores -->

        <div class="alerts" id="ovAlerts">
          <button class="pill warn" id="tPw" data-lf="paper"><b class="num" id="tP">—</b><span data-t="paperIssues"></span></button>
          <button class="pill" id="tNgw" data-lf="neg"><b class="num" id="tNg">—</b><span data-t="negBal"></span></button>
          <button class="pill" id="tVxw" data-lf="vat"><b class="num" id="tVx">—</b><span data-t="vatExpN"></span></button>

      </div>
      <div class="insights" id="ins">

      <div class="chips" id="qbx">

      <div id="pinv" class="hide"><div id="invs"></div></div>

async function userEmail(u){

async function api(path, opt={}){
  const h = {apikey:SB_KEY, "Content-Type":"application/json", ...(opt.headers||{})};
  if (opt.auth !== false && tok) h.Authorization = "Bearer " + tok;
  let r;
  try { r = await fetch(SB_URL + path, {method:opt.method||"GET", headers:h, body:opt.body?JSON.stringify(opt.body):undefined}); }
  catch(e){ const er = new Error("net"); er.net = true; throw er; }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null } catch(e){}
  if (!r.ok){ const er = new Error((j && (j.error_description||j.msg||j.message||j.error)) || ("HTTP "+r.status)); er.status = r.status; throw er; }
  return j;
}
function take(j, remember){
  tok = j.access_token; refreshTok = j.refresh_token; expAt = Date.now() + (Number(j.expires_in||3600) - 60)*1000;
  if (remember) LS.set("rmg_rt", refreshTok);
}
async function ensure(){
  if (refreshTok && Date.now() > expAt){
    take(await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",auth:false,body:{refresh_token:refreshTok}}), !!LS.get("rmg_rt"));
  }
}
async function getAll(path){
  await ensure();
  let out = [], s = 0;
  for(;;){
    const j = await api(path, {headers:{"Range-Unit":"items", Range:`${s}-${s+999}`}}) || [];
    out = out.concat(j);
    if (j.length < 1000) return out;
    s += 1000;
  }
}

/* ---------------- أرقام بتعدّ لحد قيمتها (مرة لما الرقم يتغير) ---------------- */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countTo(el, v, f = fmt){
  const old = el._v;
  el._v = v;
  if (RM || old === v || !isFinite(v)) { el.textContent = f(v); return; }
  const from = isFinite(old) ? old : 0, t0 = performance.now(), dur = 900;
  cancelAnimationFrame(el._raf);
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = f(from + (v - from) * e);
    if (k < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}
const intf = v => Math.round(v).toLocaleString("en-US");

}

function renderInsights(ms){
  const ids = new Set(ms.map(m => m.id));
  // صافي الأوردرات آخر 6 شهور
  const now = new Date(), months = [];
  for (let i = 5; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({k: d.toISOString().slice(0,7), d, o: 0, r: 0}); }
  const idx = new Map(months.map((m, i) => [m.k, i]));
  for (const r of extra.orders){ if (!ids.has(r.merchant_id)) continue; const i = idx.get(String(r.date).slice(0,7)); if (i === undefined) continue;
    if (r.kind === "return") months[i].r += Number(r.amount || 0); else months[i].o += Number(r.amount || 0); }
  const mx = Math.max(1, ...months.map(m => m.o));
  const any = months.some(m => m.o || m.r);
  const loc = lang === "zh" ? "zh-CN" : lang === "en" ? "en-US" : "ar-EG";
  const net = months[5].o - months[5].r, prev = months[4].o - months[4].r;
  const ch = prev ? Math.round((net - prev) / Math.abs(prev) * 100) : null;
  $("insOrdSub").innerHTML = any ? `<b class="num">${shortf(net)}</b>${ch === null ? "" : ` <span class="num ${ch >= 0 ? "up" : "dn"}">${ch >= 0 ? "▲" : "▼"} ${Math.abs(ch)}%</span>`}` : "";
  $("chOrd").innerHTML = !any ? `<div class="nodata">${esc(t("noOrdData"))}</div>` :
    `<div class="bars">${months.map((m, i) => `<div class="bc${i === 5 ? " cur" : ""}" title="${m.k}: ${fmt(m.o - m.r)}">
        <span class="bv num">${m.o ? shortf(m.o - m.r) : ""}</span>
        <div class="bt"><i style="--h:${m.o / mx * 100}%"></i><s style="--h:${m.r / mx * 100}%"></s></div>

function shrinkImage(file){        // صور الموبايل كبيرة — نصغّرها قبل الرفع
  return new Promise(res => {
    if (!/^image\/(jpeg|png|webp)$/i.test(file.type) || file.size < 1.2e6) return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 2200 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); res(b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", {type:"image/jpeg"}) : file); }, "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

    if (!res.ok) throw new Error("HTTP " + res.status);

    const a = document.createElement("a"); a.href = url; a.download = r.file_name || "document";

/* ---------------- كشف حساب تفصيلي (دائن ومدين) — من صفر ---------------- */
function ledgerRows(m, a, b){
  // زي كشف B-TECH: الرصيد = دائن − مدين (سالب = على التاجر، موجب = للتاجر)
  // الحافز دائن أول ما ينزل — والمستخدم سطر بيان بس (اتحسب خلاص) وبينقص رصيد الحوافز
  const ev = [], docs = new Map();
  for (const r of extra.orders) if (r.merchant_id === m.id){
    const k = r.kind + "|" + (r.doc_no || ("#" + r.id));
    const d = docs.get(k) || {kind:r.kind, doc:r.doc_no || ("#" + r.id), date:r.date, amount:0, id:r.id};
    d.amount += Number(r.amount||0); if (r.date < d.date) d.date = r.date; docs.set(k, d);
  }
  for (const d of docs.values()) ev.push(d.kind === "return" ? {d:d.date, o:1, i:d.id, k:"kReturn", ref:d.doc, dr:0, cr:d.amount}
                                                             : {d:d.date, o:0, i:d.id, k:"kOrder", ref:d.doc, dr:d.amount, cr:0});
  for (const r of (extra.collections||[])) if (r.merchant_id === m.id) ev.push({d:r.date, o:2, i:r.id, k:"kColl", ref:"", note:r.notes||"", dr:0, cr:Number(r.amount||0)});
  for (const r of extra.bank_balances) if (r.merchant_id === m.id){ const dep = bankParts(r)[0]; if (dep) ev.push({d:r.date, o:3, i:r.id, k:"kDep", ref:r.notes||"", dr:0, cr:dep}); }
  m.tx.forEach((r, i) => {
    const n = /\.(xlsx|xlsm|xls)$/i.test(r.notes) ? "" : r.notes;
    if (r.type === "incentive" || r.type === "opening") ev.push({d:r.date, o:4, i, k:r.type === "opening" ? "kIncOp" : "kInc", ref:"", note:n, dr:0, cr:r.amount, inc:r.amount});
    else if (r.type === "usage") ev.push({d:r.date, o:5, i, k:"kUsed", ref:"", note:n, dr:0, cr:0, used:r.amount, inc:-r.amount});
  });
  ev.sort((x, y) => (x.d < y.d ? -1 : x.d > y.d ? 1 : x.o - y.o || x.i - y.i));
  let opening = 0, run = null, incOpen = 0, incRun = 0; const out = [];
  for (const e of ev){
    if (e.d < a){ opening += e.cr - e.dr; incOpen += e.inc || 0; continue; }
    if (e.d > b) continue;
    if (run === null){ run = opening; incRun = incOpen; }
    run += e.cr - e.dr; incRun += e.inc || 0;
    out.push({date:e.d, kind:e.k, ref:e.ref || "", note:e.note || "", dr:e.dr, cr:e.cr, used:e.used || 0, bal:run, inc: e.inc ? incRun : null});
  }
  const sum = (k, f) => out.filter(r => k.includes(r.kind)).reduce((s, r) => s + r[f], 0);
  const incIn = sum(["kInc", "kIncOp"], "cr"), incUsed = sum(["kUsed"], "used");
  return {opening, rows:out, end: out.length ? out[out.length-1].bal : opening,
          inc:{open:incOpen, in:incIn, used:incUsed, left:incOpen + incIn - incUsed},
          cats:[["kOrder", sum(["kOrder"], "dr"), 0], ["kReturn", 0, sum(["kReturn"], "cr")], ["kColl", 0, sum(["kColl"], "cr")],
                ["kDep", 0, sum(["kDep"], "cr")], ["kInc", 0, incIn]]};
}
const ledSide = v => v < -0.004 ? t("owes") : v > 0.004 ? t("owed") : "";
function rowNote(r){
  const parts = [];
  if (r.used) parts.push(fmt(r.used));
  if (r.note) parts.push(r.note);
  if (r.inc !== null && r.inc !== undefined) parts.push(`${t("incBal")} ${fmt(r.inc)}`);
  return parts.join(" — ");
}

      ${r.dr ? `<td class="num r minus">${fmt(r.dr)}</td>` : `<td class="r">${dash}</td>`}

      <td class="num r${r.bal < -0.004 ? " minus" : ""}"><b>${fmt(r.bal)}</b></td></tr>`; }).join("") +
    (L.rows.length ? "" : `<tr><td colspan="6" class="n" style="text-align:center;padding:18px">${esc(t("noLed"))}</td></tr>`) +
    `<tr class="last"><td colspan="2">${esc(t("ledEnd"))} ${esc(ledSide(L.end))}</td><td class="hn"></td><td class="num r">${fmt(D)}</td><td class="num r">${fmt(C)}</td>
      <td class="num r">${fmt(L.end)}</td></tr></tbody></table></div>`;

/* ---- نموذج الكشف (مشترك بين PDF و Excel) ---- */

}

/* ---- Excel بنفس شكل كشف B-TECH (ExcelJS بيتحمل وقت الحاجة بس) ---- */
let xlLib = null;
function loadExcelJS(){
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return xlLib ||= new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    sc.onload = () => ok(window.ExcelJS); sc.onerror = () => { xlLib = null; no(new Error("load")); };
    document.head.appendChild(sc);
  });
}

  Object.assign(ws.getCell(`A${r}`), {value: t("stNotes"), font: {name: F, size: 9.5, bold: true, color: {argb: INK}}, alignment: al()});
  for (const k of ["stN1", "stN2", "stN3"]){ r++; ws.mergeCells(`A${r}:G${r}`);
    Object.assign(ws.getCell(`A${r}`), {value: "• " + t(k), font: {name: F, size: 8.5, color: {argb: "FF555555"}}, alignment: al(undefined, "top", true)}); ws.getRow(r).height = 18; }
  r += 3;
  [["A", "B", "stSig1"], ["C", "E", "stSig2"], ["F", "G", "stSig3"]].forEach(([a1, a2, k]) => {
    ws.mergeCells(`${a1}${r}:${a2}${r}`);
    Object.assign(ws.getCell(`${a1}${r}`), {value: t(k), font: {name: F, size: 9, color: {argb: "FF555555"}}, alignment: {horizontal: "center", vertical: "top"}});
    for (let cc = ws.getColumn(a1).number; cc <= ws.getColumn(a2).number; cc++) ws.getCell(r, cc).border = {top: {style: "thin", color: {argb: "FF999999"}}};
  });
  ws.getRow(r).height = 30;
  return wb.xlsx.writeBuffer();
}
$("ledCsv").onclick = async () => {
  if (!ledCache) return;
  const b = $("ledCsv"), old = b.textContent; b.disabled = true; b.textContent = "…";
  try{
    const S = stModel(), buf = await stXlsx(S);
    const blob = new Blob([buf], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url = URL.createObjectURL(blob), el = document.createElement("a");
    el.href = url; el.download = `statement_${S.m.code}_${S.today}.xlsx`;
    document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(e){ console.warn(e); alert(t("stXlErr")); }

/* ==================== حركة مع الماوس: ضوء + ميل + نجوم ==================== */
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  if (reduce) return;
  // ضوء بيتبع الماوس على اللوحات والكروت + الكرة الصفرا بتتحرك عكسه شوية
  let raf = 0, ev = null;
  const onMove = e => { ev = e; if (!raf) raf = requestAnimationFrame(apply); };
  function apply(){
    raf = 0; const e = ev; if (!e) return;
    const el = e.target.closest && e.target.closest(".glow,.glow-l,.store,#lbtn");
    for (const g of [el, el && el.closest(".glow")].filter(Boolean)) {
      const r = g.getBoundingClientRect();
      g.style.setProperty("--mx", (e.clientX - r.left) + "px"); g.style.setProperty("--my", (e.clientY - r.top) + "px");
      if (g.matches(".overview,.hero")) {
        g.style.setProperty("--px", ((e.clientX - r.left) / r.width - .5) * -28 + "px");
        g.style.setProperty("--py", ((e.clientY - r.top) / r.height - .5) * -28 + "px");
      }
    }
    if (fine) tilt(e);
  }
  // ميل ثلاثي الأبعاد خفيف للكروت (ماوس بس)
  let tilted = null;
  function tilt(e){
    const t = e.target.closest && e.target.closest(".tilt");
    if (tilted && tilted !== t) { tilted.style.transform = ""; tilted.classList.remove("tilting"); tilted = null; }
    if (!t) return;
    const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    const k = t.classList.contains("hero") ? 5 : 4;
    t.style.transform = `perspective(900px) rotateX(${(-y * k).toFixed(2)}deg) rotateY(${(x * k).toFixed(2)}deg) translateZ(0)`;
    t.classList.add("tilting"); tilted = t;
  }
  document.addEventListener("pointermove", onMove, {passive: true});
  document.addEventListener("pointerleave", () => { if (tilted) { tilted.style.transform = ""; tilted.classList.remove("tilting"); tilted = null; } });
  // لمس: الضوء بيظهر مكان الصابع
  document.addEventListener("pointerdown", e => { const g = e.target.closest && e.target.closest(".glow"); if (g) { g.classList.add("act"); onMove(e); setTimeout(() => g.classList.remove("act"), 900); } }, {passive: true});

  // نجوم صغيرة بتتحرك وبتتشد ناحية الماوس (على اللوحات الغامقة وصفحة الدخول)
  function stars(host){
    if (host._fx) return; host._fx = 1;
    const c = document.createElement("canvas"); c.className = "fx"; host.prepend(c);
    const x = c.getContext("2d"); let W = 0, H = 0, dpr = Math.min(2, devicePixelRatio || 1), pts = [], m = {x: -1e4, y: -1e4}, on = false, id = 0;
    const N = () => Math.round(Math.min(46, Math.max(16, W * H / 9000)));
    function size(){
      const r = host.getBoundingClientRect(); W = r.width; H = r.height;
      c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
      while (pts.length < N()) pts.push({x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, r: Math.random() * 1.4 + .6});
      pts.length = N();
    }
    host.addEventListener("pointermove", e => { const r = host.getBoundingClientRect(); m.x = e.clientX - r.left; m.y = e.clientY - r.top; }, {passive: true});
    host.addEventListener("pointerleave", () => { m.x = m.y = -1e4; });
    function frame(){
      if (!on) return;
      x.clearRect(0, 0, W, H);
      for (const p of pts) {
        const dx = m.x - p.x, dy = m.y - p.y, d2 = dx * dx + dy * dy;
        if (d2 < 22000) { p.vx += dx / 9000; p.vy += dy / 9000; }
        p.vx *= .985; p.vy *= .985; p.x += p.vx + .03; p.y += p.vy;
        if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10; if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
      }
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 90) { x.strokeStyle = `rgba(255,201,21,${(1 - d / 90) * .18})`; x.lineWidth = 1; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); }
      }
      for (const p of pts) {
        const near = Math.hypot(m.x - p.x, m.y - p.y) < 120;
        x.fillStyle = near ? "rgba(255,214,70,.95)" : "rgba(255,255,255,.45)";
        x.beginPath(); x.arc(p.x, p.y, near ? p.r + .8 : p.r, 0, 6.283); x.fill();
      }
      id = requestAnimationFrame(frame);
    }
    const start = () => { if (!on) { on = true; size(); id = requestAnimationFrame(frame); } };
    const stop = () => { on = false; cancelAnimationFrame(id); };
    new IntersectionObserver(es => es.forEach(en => en.isIntersecting && !document.hidden && host.offsetParent ? start() : stop())).observe(host);
    new ResizeObserver(() => on && size()).observe(host);
    document.addEventListener("visibilitychange", () => document.hidden ? stop() : (host.offsetParent && start()));
  }
  document.querySelectorAll(".fxhost").forEach(stars);
})();
</script>
