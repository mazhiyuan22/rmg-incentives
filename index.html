<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RMG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>RMG Incentives</title>
<style>
:root{
  --paper:#F4F5F7; --sheet:#FFFFFF; --ink:#17202B; --ink2:#3A4452; --mute:#69727F; --line:#E4E7EC;
  --yel:#FFC915; --yel2:#FFF6D6; --green:#1E7F53; --red:#C2362B; --redbg:#FCEDEB;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,"PingFang SC","Noto Sans SC","Microsoft YaHei",Tahoma,sans-serif;
  font-size:15px;line-height:1.45}
:lang(zh) body,:lang(zh) button,:lang(zh) input,:lang(zh) select{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei","IBM Plex Sans Arabic",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
span.num{white-space:nowrap}
/* الأرقام اتجاهها LTR — نثبّت محاذاتها حسب لغة الصفحة */
[dir=rtl] .num{text-align:right}
[dir=rtl] .r.num,[dir=rtl] .bal .num,[dir=rtl] .doc .a .num{text-align:left}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* language picker */
.lang{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:600;min-width:0}

/* ---------- login ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px}
#login .ltop{display:flex;justify-content:flex-end}
.lwrap{flex:1;display:flex;align-items:center;justify-content:center}
.lbox{width:100%;max-width:360px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.mark{width:48px;height:48px;border-radius:12px;background:var(--yel);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--ink);flex:none}
.brand h1{margin:0;font-size:22px;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--mute);font-size:13px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
input[type=text],input[type=password],input[type=search],input[type=date],select.in{
  width:100%;padding:12px 14px;border:1px solid #CDD2DA;border-radius:10px;background:var(--sheet);outline:none;font-size:16px}
input:focus,select.in:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,32,43,.08)}
.chk{display:flex;gap:10px;align-items:center;margin:16px 0 0;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;margin-top:20px}
.btn:disabled{opacity:.55}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:20px;margin-top:12px}

/* ---------- app shell ---------- */
header{position:sticky;top:0;z-index:5;background:var(--sheet);border-bottom:1px solid var(--line);
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto}
.hrow .mark{width:34px;height:34px;border-radius:9px;font-size:11px}
.hrow h2{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink2);flex:none;padding:0}
.ib svg{width:17px;height:17px}
.upd{font-size:12px;color:var(--mute);max-width:900px;margin:4px auto 0}
main{padding:14px 16px 48px;max-width:900px;margin:0 auto}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.banner.chg{background:var(--yel2);color:#6B5200}
.banner.off{background:var(--redbg);color:var(--red);font-weight:600}

/* ---------- list ---------- */
.overview{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;margin:4px 0 16px}
.overview .main{flex:1 1 220px}
.overview .lbl{font-size:13px;color:var(--mute);display:block}
.overview .big{font-size:30px;font-weight:700;line-height:1.15}
.overview .sm{display:flex;gap:22px}
.overview .sm b{display:block;font-size:16px;font-weight:600}
.overview .sm .warn b{color:var(--red)}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters input{flex:2;min-width:0}
.filters select{flex:1;min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.store{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;text-align:start}
.store:first-child{border-top:0}
.store:hover{background:#FAFBFC}
.store .who{flex:1;min-width:0}
.store .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store .mt{font-size:12.5px;color:var(--mute);margin-top:1px;display:flex;flex-wrap:wrap;gap:2px 12px}
.store .bal{text-align:end;white-space:nowrap}
.store .bal b{font-size:16px;font-weight:700;display:block}
.store .bal span{font-size:12px;color:var(--mute)}
.store .bal b.neg{color:var(--red)}
.store .dot{width:8px;height:8px;border-radius:50%;background:var(--yel);flex:none}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px}
.tag.r{background:var(--redbg);color:var(--red)}
.chev{width:16px;height:16px;color:#B5BCC6;flex:none}
[dir=rtl] .chev{transform:scaleX(-1)}
.empty{text-align:center;color:var(--mute);padding:40px 16px}

/* ---------- store ---------- */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--ink2);font-weight:600;padding:2px 0 12px;font-size:14px}
.back svg{width:18px;height:18px}
[dir=rtl] .back svg{transform:scaleX(-1)}
.paper{background:var(--redbg);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:600;margin-bottom:10px;font-size:14px}
.hero{background:var(--yel);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:6px}
.hero h3{margin:0;font-size:18px;line-height:1.3}
.hero .meta{font-size:13px;color:#5A4A12;margin-top:2px}
.hero .lbl{font-size:13px;margin-top:14px;color:#4A3D0E}
.hero .big{font-size:34px;font-weight:700;line-height:1.1}
.hero .big.neg{color:#9E2318}
.hero .parts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(23,32,43,.15);font-size:13px}
.hero .parts b{display:block;font-size:15px;font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px 9px;color:var(--mute);font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--yel)}
.tabs .cnt{font-size:11px;background:#E9ECF0;border-radius:999px;padding:0 6px;margin-inline-start:5px;color:var(--ink2)}
.tabs .cnt:empty{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid #CDD2DA;background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--ink2)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.range{display:flex;gap:8px;margin-bottom:12px}
.range>div{flex:1}
.range label.f{margin-top:0}

/* totals line above tables */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.totals div{background:var(--sheet);padding:10px 12px}
.totals span{display:block;font-size:12px;color:var(--mute)}
.totals b{font-size:16px;font-weight:600}
.totals .key{background:var(--yel2)}
.totals .key b{font-weight:700}

/* tables */
.tbl{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--mute);padding:10px 10px 8px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-top:1px solid #EEF0F3;vertical-align:middle;text-align:start}
.tbl tr:first-child td{border-top:0}
.tbl th.r,.tbl td.r{text-align:end}
.tbl td.k{font-weight:500;white-space:nowrap}
.tbl td.n{color:var(--mute);font-size:12.5px}
.tbl tr.edge td{background:#F8F9FA;color:var(--ink2)}
.tbl tr.last td{background:var(--yel2);font-weight:700;border-top:1px solid var(--line)}
.tbl .dash{color:#C5CBD3}
.tbl tbody td:first-child{white-space:nowrap}
.plus{color:var(--green)}.minus{color:var(--red)}
@media (max-width:560px){.tbl .hn{display:none}.tbl table{font-size:13px}.tbl td,.tbl th{padding:9px 6px}}
.foot{margin-top:10px;color:var(--mute);font-size:12.5px}

/* orders */
.doc{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.doc+.doc{margin-top:8px}
.doc .dh{display:flex;justify-content:space-between;gap:10px}
.doc .k{font-weight:600}
.doc .d{font-size:12.5px;color:var(--mute)}
.doc .a{text-align:end;white-space:nowrap}
.doc .a b{font-size:15px}
.doc .items{margin-top:8px;border-top:1px solid #EEF0F3;padding-top:6px}
.doc .it{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;color:var(--ink2)}
.doc .it .c{color:var(--mute)}
.kind{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;margin-inline-end:6px}
.kind.o{background:#E6F2EC;color:var(--green)}
.kind.rt{background:var(--redbg);color:var(--red)}

/* files (invoices + docs) */
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.file:first-child{border-top:0}
.file .ic{width:40px;height:40px;border-radius:9px;background:var(--paper);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2);flex:none}
.file .tt{flex:1;min-width:0}
.file .tt b{display:block;font-weight:600}
.file .tt span{font-size:12.5px;color:var(--mute)}
.sbtn{border:1px solid #CDD2DA;background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-grid;place-items:center}
.sbtn.del{color:var(--red);border-color:#F0C9C4;padding:7px 10px}
.sbtn:disabled{opacity:.5}
.upbox{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.upbox h4{margin:0 0 10px;font-size:15px}
.pick{display:block;border:1.5px dashed #B9C0CA;border-radius:10px;padding:18px 12px;text-align:center;color:var(--ink2);font-weight:600;cursor:pointer;background:#FAFBFC}
.pick.has{border-style:solid;border-color:var(--green);background:#EEF7F2;color:var(--green)}
.upbox input[type=text]{margin-top:8px}
.upbox .btn{margin-top:10px}
.upbox .err{min-height:0;margin-top:8px}

.spin{width:16px;height:16px;border:2px solid #D4D9E0;border-top-color:var(--ink);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (min-width:700px){
  .hero{display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:24px}
  .hero .lbl{margin-top:0}
  .hero .bx{text-align:end}
  [dir=rtl] .hero .bx .num{text-align:left}
  .hero .parts{grid-column:1/-1}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="ltop">
    <select class="lang" aria-label="Language">
      <option value="ar">عربي</option><option value="en">English</option><option value="zh">中文</option>
    </select>
  </div>
  <div class="lwrap">
    <form class="lbox" id="lform" autocomplete="on">
      <div class="brand">
        <div class="mark">RMG</div>
        <div><h1 data-t="appTitle"></h1><p data-t="loginSub"></p></div>
      </div>
      <label class="f" for="u" data-t="user"></label>
      <input id="u" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" data-tp="userPh" required>
      <label class="f" for="p" data-t="pass"></label>
      <input id="p" type="password" name="password" autocomplete="current-password" required>
      <label class="chk"><input type="checkbox" id="rem" checked> <span data-t="remember"></span></label>
      <button class="btn" id="lbtn" type="submit" data-t="signIn"></button>
      <div class="err" id="lerr" role="alert"></div>
    </form>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="app" class="hide">
  <header>
    <div class="hrow">
      <div class="mark">RMG</div>
      <h2 id="who"></h2>
      <select class="lang" aria-label="Language">
        <option value="ar">عربي</option><option value="en">EN</option><option value="zh">中文</option>
      </select>
      <button class="ib" id="rbtn" data-ta="refresh"></button>
      <button class="ib" id="obtn" data-ta="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
    <div class="upd" id="upd"></div>
  </header>
  <main>
    <div id="banner" class="banner hide" role="status"></div>

    <!-- list of stores -->
    <div id="vlist">
      <div class="overview">
        <div class="main"><span class="lbl" data-t="totalAvail"></span><div class="big num" id="tB">—</div></div>
        <div class="sm">
          <div><span class="lbl" data-t="storeCount"></span><b class="num" id="tN">—</b></div>
          <div><span class="lbl" data-t="totalUsed"></span><b class="num" id="tU">—</b></div>
          <div class="warn" id="tPw"><span class="lbl" data-t="paperIssues"></span><b class="num" id="tP">—</b></div>
        </div>
      </div>
      <div class="filters">
        <input type="search" id="q" data-tp="search">
        <select id="reg" class="in"></select>
      </div>
      <div class="sheet" id="list"></div>
    </div>

    <!-- one store -->
    <div id="vst" class="hide">
      <button class="back" id="bk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span data-t="stores"></span></button>
      <div id="spaper" class="paper hide"></div>
      <div class="hero">
        <div><h3 id="sname"></h3><div class="meta" id="smeta"></div></div>
        <div class="bx"><div class="lbl" data-t="avail"></div><div class="big num" id="sbal"></div></div>
        <div class="parts">
          <div><span data-t="opening"></span><b class="num" id="pOp"></b></div>
          <div><span data-t="incentive"></span><b class="num" id="pIn"></b></div>
          <div><span data-t="used"></span><b class="num" id="pUs"></b></div>
          <div id="pBkw"><span data-t="bankBal"></span><b class="num" id="pBk"></b></div>
        </div>
      </div>
      <nav class="tabs" id="seg">
        <button data-p="st" class="on" data-t="tabSt"></button>
        <button data-p="ord"><span data-t="tabOrd"></span><span class="cnt num" id="cO"></span></button>
        <button data-p="inv"><span data-t="tabInv"></span><span class="cnt num" id="cI"></span></button>
        <button data-p="bank" data-t="tabBank"></button>
        <button data-p="doc"><span data-t="tabDoc"></span><span class="cnt num" id="cD"></span></button>
      </nav>
      <div class="chips" id="qbx">
        <button data-r="all" class="on" data-t="rAll"></button>
        <button data-r="month" data-t="rMonth"></button>
        <button data-r="custom" data-t="rCustom"></button>
      </div>
      <div class="range hide" id="rng">
        <div><label class="f" for="df" data-t="from"></label><input type="date" id="df"></div>
        <div><label class="f" for="dt" data-t="to"></label><input type="date" id="dt"></div>
      </div>
      <div id="txs"></div>
      <div id="pord" class="hide">
        <div class="chips" id="kb">
          <button data-k="" class="on" data-t="all"></button><button data-k="order" data-t="orders"></button><button data-k="return" data-t="returns"></button>
        </div>
        <div class="totals" id="osum"></div>
        <div id="ords"></div>
      </div>
      <div id="pinv" class="hide"><div id="invs"></div></div>
      <div id="pbank" class="hide"><div id="banks"></div></div>
      <div id="pdoc" class="hide">
        <div class="upbox">
          <h4 data-t="upTitle"></h4>
          <div class="chips" id="dtype">
            <button data-t="iqrar" data-v="iqrar" class="on"></button><button data-t="ikhtar" data-v="ikhtar"></button>
          </div>
          <label class="pick" for="dfile"><span id="dfname"></span></label>
          <input id="dfile" type="file" accept="image/*,application/pdf" class="hide">
          <input id="dnote" type="text" data-tp="noteOpt">
          <button class="btn" id="dup" data-t="upload"></button>
          <div class="err" id="dmsg"></div>
        </div>
        <div id="docs"></div>
      </div>
    </div>
  </main>
</section>

<script>

/* بحث مرن: أ/ا، ة/ه، ى/ي، المسافات، الكابيتال — وكل كلمة بأي ترتيب */
const normAr = s => String(s??"").normalize("NFKC").toLowerCase().replace(/[ً-ٰٟـ]/g,"")
  .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/[^\p{L}\p{N}]/gu,"");
const words = s => String(s||"").split(/\s+/).map(w=>{ let k = normAr(w); if (k.startsWith("ال") && k.length > 4) k = k.slice(2); return k; }).filter(Boolean);
/* اليوزر بالعربي (اسم الأريا مانجر) بيتحوّل لكود ثابت — نفس قاعدة البرنامج */
const normPw = p => String(p||"").replace(/\s+/g,"").toLowerCase()
  .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
async function userEmail(u){
  const s = String(u||"").trim().toLowerCase();
  if (/^[a-z0-9._-]+$/.test(s)) return `${s}@${EMAIL_DOMAIN}`;
  const k = normAr(s);
  if (/^[a-z0-9._-]+$/.test(k)) return `${k}@${EMAIL_DOMAIN}`;
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(k));
  return "am" + [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,24) + "@" + EMAIL_DOMAIN;
}

/* ---------------- API ---------------- */
async function api(path, opt={}){
  const h = {apikey:SB_KEY, "Content-Type":"application/json", ...(opt.headers||{})};
  if (opt.auth !== false && tok) h.Authorization = "Bearer " + tok;
  let r;
  try { r = await fetch(SB_URL + path, {method:opt.method||"GET", headers:h, body:opt.body?JSON.stringify(opt.body):undefined}); }
  catch(e){ const er = new Error("net"); er.net = true; throw er; }
  const txt = await r.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null } catch(e){}
  if (!r.ok){ const er = new Error((j && (j.error_description||j.msg||j.message||j.error)) || ("HTTP "+r.status)); er.status = r.status; throw er; }
  return j;
}
function take(j, remember){
  tok = j.access_token; refreshTok = j.refresh_token; expAt = Date.now() + (Number(j.expires_in||3600) - 60)*1000;
  if (remember) LS.set("rmg_rt", refreshTok);
}
async function ensure(){
  if (refreshTok && Date.now() > expAt){
    take(await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",auth:false,body:{refresh_token:refreshTok}}), !!LS.get("rmg_rt"));
  }
}
async function getAll(path){
  await ensure();
  let out = [], s = 0;
  for(;;){
    const j = await api(path, {headers:{"Range-Unit":"items", Range:`${s}-${s+999}`}}) || [];
    out = out.concat(j);
    if (j.length < 1000) return out;
    s += 1000;
  }
}

}

let loading = false;
async function load(force){
  if (loading || !refreshTok && !tok) return;
  loading = true;
  $("rbtn").innerHTML = '<div class="spin"></div>';
  try{
    const me = await getAll("/rest/v1/supervisors?select=display_name,username");
    const ms = await getAll("/rest/v1/merchants_pub?select=*&order=name");
    const s = JSON.stringify(ms.map(m=>[m.id,m.updated_at]).sort());
    await ensure();
    const xs = await extraSig();
    let xch = false;
    if (force || xs !== xsig || s !== sig){ extra = await fetchExtra(); xsig = xs; xch = true; }
    if (force || s !== sig){
      const tx = await getAll("/rest/v1/tx_pub?select=merchant_id,date,type,amount,notes,balance,seq&order=merchant_id,seq");
      sig = s;
      apply(me, ms, tx);
    } else if (xch){ renderList(); if (cur != null) renderSt(); }
    lastOk = new Date(); offline(false); age();
  }catch(e){
    if (e.status === 401 || e.status === 403 && /jwt/i.test(e.message)) { LS.set("rmg_rt", null); showLogin(t("session")); }
    else offline(true, niceErr(e));
  }
  loading = false;
  $("rbtn").innerHTML = ICON_REFRESH;
}
function apply(me, ms, tx){
  const by = {};
  for (const r of tx) (by[r.merchant_id] ||= []).push({date:r.date, type:r.type, amount:+r.amount, notes:r.notes||"", balance:+r.balance});
  const newest = ms.reduce((a,m)=> m.updated_at > a ? m.updated_at : a, "");
  const nd = {
    who: me[0] ? (me[0].display_name || me[0].username) : "",
    at: newest,
    ms: ms.map(m=>({id:m.id, code:String(m.code), name:m.name, region:m.region||"", bad:!!m.paper_issue, note:m.paper_note||"",
                    op:+m.opening, inc:+m.incentive, used:+m.used, bal:+m.balance, tx:by[m.id]||[]}))
  };
  if (data){
    const old = Object.fromEntries(data.ms.map(m=>[m.id,m.bal]));
    const now = new Set(nd.ms.map(m=>m.id));
    const ch = nd.ms.filter(m=> !(m.id in old) || Math.abs(old[m.id]-m.bal) > 0.004);
    const gone = data.ms.filter(m=>!now.has(m.id)).length;
    ch.forEach(m=>changed.add(m.id));
    if (ch.length || gone){
      let s = t("updated", tm(new Date()));
      if (ch.length) s += " — " + t("balCh", ch.length, ch.slice(0,5).map(m=>m.name).join("، ") + (ch.length>5?" …":""));
      if (gone) s += " — " + t("gone", gone);
      banner(s, "chg");
      try{ navigator.vibrate && navigator.vibrate(120) }catch(e){}
    }
  }
  data = nd;
  $("who").textContent = data.who || t("appTitle");
  regions(); renderList();
  if (cur != null){ if (data.ms.some(m=>m.id===cur)) renderSt(); else showList(); }
}
function banner(s, cls){ const b = $("banner"); b.className = "banner " + cls; b.textContent = s; }
function offline(on, why){
  if (on) banner(lastOk ? t("offLast", why, tm(lastOk)) : t("off", why), "off");
  else if ($("banner").classList.contains("off")) $("banner").className = "banner hide";
}
function age(){
  if (!data) return;
  let a = "";
  if (data.at){
    const mins = (Date.now() - new Date(data.at)) / 60000;
    a = t("lastEdit", mins < 1 ? t("justNow") : mins < 60 ? t("minsAgo", Math.floor(mins)) : mins < 1440 ? t("hoursAgo", Math.floor(mins/60)) : t("daysAgo", Math.floor(mins/1440)));
  }
  $("upd").textContent = a + (lastOk ? (a ? "  |  " : "") + t("lastCheck", tm(lastOk, true)) : "");
}

  sel.value = rs.includes(v) ? v : "";
  sel.classList.toggle("hide", rs.length < 2);
}
function visible(){
  const ws = words($("q").value), r = $("reg").value;
  return data.ms.filter(m => { const h = normAr(`${m.code} ${m.name} ${m.region}`); return ws.every(w => h.includes(w)) && (!r || m.region === r); });
}
function renderList(){
  if (!data) return;
  const ms = visible();
  $("tN").textContent = ms.length + (ms.length !== data.ms.length ? ` / ${data.ms.length}` : "");
  $("tB").textContent = fmt(ms.reduce((a,m)=>a+m.bal,0));
  $("tU").textContent = fmt(ms.reduce((a,m)=>a+m.used,0));
  const pb = ms.filter(m=>m.bad).length;
  $("tP").textContent = pb; $("tPw").classList.toggle("hide", !pb);
  $("list").innerHTML = ms.length ? ms.map(m=>{ const b = lastBank(m.id); return `
    <button class="store" data-id="${m.id}">
      ${changed.has(m.id) ? '<span class="dot" aria-hidden="true"></span>' : ""}
      <div class="who">
        <div class="nm">${esc(m.name)}</div>
        <div class="mt"><span class="num">${esc(m.code)}</span>${m.region?`<span>${esc(m.region)}</span>`:""}${m.used ? `<span>${esc(t("usedShort"))}<span class="num">${fmt(m.used)}</span></span>` : ""}${b ? `<span>${esc(t("bankShort"))}<span class="num">${fmt(b.balance)}</span></span>` : ""}${m.bad ? `<span class="tag r">${esc(t("paper"))}</span>` : ""}</div>
      </div>
      <div class="bal"><b class="num ${m.bal<0?"neg":""}">${fmt(m.bal)}</b><span>${esc(t("avail"))}</span></div>
      ${CHEV}
    </button>`; }).join("") : `<div class="empty">${esc(data.ms.length ? t("noMatch") : t("noStores"))}</div>`;
}
$("q").addEventListener("input", renderList);
$("reg").addEventListener("change", renderList);
$("list").addEventListener("click", e => {
  const b = e.target.closest(".store"); if (!b) return;
  cur = +b.dataset.id; changed.delete(cur); showSt();
});

/* ---------------- store view ---------------- */
function lastBank(id){      // رصيد البنك = مجموع الحركات (إيداع + / سحب −)
  let n = 0, s = 0;
  for (const r of extra.bank_balances) if (r.merchant_id === id){ n++; s += Number(r.balance||0); }
  return n ? {balance:s} : null;
}
function pickIn(boxId, attr, fn){
  $(boxId).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll(`#${boxId} button`).forEach(x=>x.classList.toggle("on", x===b));
    fn(b.dataset[attr]);
  });
}
pickIn("seg", "p", v => { pane = v; renderSt(); const b = document.querySelector("#seg button.on"); b && b.scrollIntoView({inline:"nearest", block:"nearest"}); });
pickIn("kb", "k", v => { okind = v; renderSt(); });

function renderOrders(m, a, b){
  const rows = extra.orders.filter(r => r.merchant_id === m.id && r.date >= a && r.date <= b && (!okind || r.kind === okind));
  const docs = new Map();
  for (const r of rows){ const k = r.kind + "|" + (r.doc_no || ("#" + r.id)); if (!docs.has(k)) docs.set(k, []); docs.get(k).push(r); }
  const o = rows.filter(r=>r.kind==="order"), rt = rows.filter(r=>r.kind==="return");
  const S = (xs,f)=>xs.reduce((s,r)=>s+Number(r[f]||0),0);
  const so = S(o,"amount"), sr = S(rt,"amount");
  const nq = xs => S(xs,"qty").toLocaleString("en-US"), nd = xs => new Set(xs.map(r=>r.doc_no||r.id)).size;
  $("osum").innerHTML = `<div><span>${esc(t("ordSum", nd(o), nq(o)))}</span><b class="num plus">${fmt(so)}</b></div>
    <div><span>${esc(t("retSum", nd(rt), nq(rt)))}</span><b class="num minus">${fmt(sr)}</b></div>
    <div class="key"><span>${esc(t("net"))}</span><b class="num">${fmt(so-sr)}</b></div>`;
  const list = [...docs.values()].sort((x,y)=> (y[0].date+y[0].id) > (x[0].date+x[0].id) ? 1 : -1);
  $("ords").innerHTML = list.length ? list.map(rs => { const r0 = rs[0], ret = r0.kind === "return"; return `
    <div class="doc">
      <div class="dh">
        <div><div class="k"><span class="kind ${ret?"rt":"o"}">${esc(t(ret?"ret":"order"))}</span><span class="num">${esc(r0.doc_no)}</span></div>
          <div class="d"><span class="num">${esc(r0.date)}</span>${r0.status?"  |  "+esc(r0.status):""}</div></div>
        <div class="a"><b class="num ${ret?"minus":"plus"}">${fmt(S(rs,"amount"))}</b><div class="d">${esc(t("pcs", S(rs,"qty").toLocaleString("en-US")))}</div></div>
      </div>
      <div class="items">${rs.map(r=>`<div class="it"><div>${esc(r.item_name||"—")} <span class="c">${esc(r.color||"")}</span></div><div class="num">${Number(r.qty||0)} × ${fmt(r.price)}</div></div>`).join("")}</div>
    </div>`; }).join("") : `<div class="empty">${esc(t("noOrd"))}</div>`;
}
function renderInv(m){
  const rows = extra.invoices.filter(r => r.merchant_id === m.id).sort((x,y)=>y.id-x.id);
  $("invs").innerHTML = rows.length ? `<div class="sheet">` + rows.map(r=>`
    <div class="file">
      <div class="ic">PDF</div>
      <div class="tt"><b>${esc(r.invoice_no || t("invoice"))}</b><span>${esc(t("pages", r.pages))}  |  ${esc(t("upAt"))}<span class="num">${esc(String(r.created_at||"").slice(0,10))}</span></span></div>
      <button class="sbtn dl" data-id="${r.id}">${esc(t("download"))}</button>
    </div>`).join("") + `</div>` : `<div class="empty">${esc(t("noInv"))}</div>`;
}

/* ---------------- الإقرار / الإخطار ---------------- */
const DOCT_AR = {iqrar:"إقرار", ikhtar:"إخطار"};   // اسم الملف على السيرفر يفضل عربي
let dtype = "iqrar";
pickIn("dtype", "v", v => { dtype = v; });
$("dfile").addEventListener("change", () => {
  const f = $("dfile").files[0];
  $("dfname").textContent = f ? `✓ ${f.name}` : t("pickFile");
  document.querySelector(".pick").classList.toggle("has", !!f); $("dmsg").textContent = "";
});
function shrinkImage(file){        // صور الموبايل كبيرة — نصغّرها قبل الرفع
  return new Promise(res => {
    if (!/^image\/(jpeg|png|webp)$/i.test(file.type) || file.size < 1.2e6) return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 2200 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); res(b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", {type:"image/jpeg"}) : file); }, "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
$("dup").onclick = async () => {
  const m = data && data.ms.find(x=>x.id===cur); if (!m) return;
  let f = $("dfile").files[0];
  const msg = (s, c) => { $("dmsg").style.color = c; $("dmsg").textContent = s; };
  if (!f){ msg(t("pickFirst"), "var(--red)"); return; }
  const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  if (!isPdf && !/^image\//.test(f.type)){ msg(t("onlyImg"), "var(--red)"); return; }
  $("dup").disabled = true; msg(t("uploading"), "var(--ink2)");
  try{
    if (!isPdf) f = await shrinkImage(f);
    if (f.size > 10*1024*1024) throw new Error(t("tooBig"));
    const ext = isPdf ? "pdf" : ((f.type.split("/")[1] || "jpg").replace("jpeg","jpg"));
    const path = `${m.id}/${dtype}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    await ensure();
    const r = await fetch(SB_URL + "/storage/v1/object/docs/" + path, {method:"POST",
      headers:{apikey:SB_KEY, Authorization:"Bearer " + tok, "Content-Type": isPdf ? "application/pdf" : f.type}, body:f});
    if (!r.ok){ const tx = await r.text(); throw new Error(r.status === 403 || /security/i.test(tx) ? t("noUpPerm") : ("HTTP " + r.status)); }
    await api("/rest/v1/merchant_docs", {method:"POST", headers:{Prefer:"return=minimal"},
      body:{merchant_id:m.id, doc_type:dtype, file_path:path, file_name:`${DOCT_AR[dtype]} - ${m.name}.${ext}`,
            mime: isPdf ? "application/pdf" : f.type, size_kb: Math.round(f.size/1024), notes:$("dnote").value.trim()}});
    $("dfile").value = ""; $("dnote").value = ""; $("dfname").textContent = t("pickFile");
    document.querySelector(".pick").classList.remove("has");
    msg(t("uploaded", t(dtype)), "var(--green)");
    extra = await fetchExtra(); xsig = null; renderSt();
  }catch(err){ msg(t("upFail", err.net ? t("noNet") : err.message), "var(--red)"); }
  $("dup").disabled = false;
};
function renderDocs(m){
  const rows = (extra.merchant_docs||[]).filter(r => r.merchant_id === m.id).sort((x,y)=>y.id-x.id);
  $("docs").innerHTML = rows.length ? `<div class="sheet">` + rows.map(r=>{ const img = (r.mime||"").startsWith("image"); return `
    <div class="file">
      <div class="ic">${img ? esc(t("image")) : "PDF"}</div>
      <div class="tt"><b>${esc(I18N[r.doc_type] ? t(r.doc_type) : r.doc_type)}</b><span><span class="num">${esc(String(r.created_at||"").slice(0,10))}</span>${r.notes?"  |  "+esc(r.notes):""}</span></div>
      <button class="sbtn" data-doc="${r.id}">${esc(t("open"))}</button>
      <button class="sbtn del" data-del="${r.id}" title="${esc(t("del"))}" aria-label="${esc(t("del"))}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>`; }).join("") + `</div>` : `<div class="empty">${esc(t("noDocs"))}</div>`;
}
async function download(bucket, r, type, failKey, b){
  b.disabled = true; const old = b.innerHTML; b.textContent = "…";
  try{
    await ensure();
    const res = await fetch(SB_URL + `/storage/v1/object/authenticated/${bucket}/` + r.file_path.split("/").map(encodeURIComponent).join("/"),
                            {headers:{apikey:SB_KEY, Authorization:"Bearer " + tok}});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const blob = new Blob([await res.blob()], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = r.file_name || "document";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(err){ alert(t(failKey) + " — " + (err.message || "")); }
  b.disabled = false; b.innerHTML = old;
}
$("docs").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.del){
    if (!confirm(t("delQ"))) return;
    try{
      await ensure();
      const j = await api(`/rest/v1/merchant_docs?id=eq.${b.dataset.del}`, {method:"PATCH", headers:{Prefer:"return=representation"}, body:{deleted_at:new Date().toISOString()}});
      if (!j || !j.length) throw new Error(t("delOwn"));
      extra = await fetchExtra(); xsig = null; renderSt();
    }catch(err){ alert(t("delFail", err.message)); }
    return;
  }
  const r = (extra.merchant_docs||[]).find(x => x.id === +b.dataset.doc); if (!r) return;
  download("docs", r, r.mime || "application/octet-stream", "openFail", b);
});
$("invs").addEventListener("click", e => {
  const b = e.target.closest(".dl"); if (!b) return;
  const r = extra.invoices.find(x => x.id === +b.dataset.id); if (!r) return;
  download("invoices", r, "application/pdf", "invErr", b);
});

/* ---------------- البنك ---------------- */
function bankParts(r){
  let dep = Number(r.deposit||0), od = Number(r.order_amount||0), inc = Number(r.incentive||0);
  if (!(dep || od || inc)){ const b = Number(r.balance||0); if (b >= 0) dep = b; else od = -b; }
  return [dep, od, inc];
}
function renderBank(m){
  const rows = extra.bank_balances.filter(r => r.merchant_id === m.id).sort((x,y)=> x.date === y.date ? x.id - y.id : (x.date < y.date ? -1 : 1));
  if (!rows.length){ $("banks").innerHTML = `<div class="empty">${esc(t("noBank"))}</div>`; return; }
  let run = 0, D = 0, O = 0, I = 0;
  const lines = rows.map(r => { const [dep, od, inc] = bankParts(r); run += dep + inc - od; D += dep; O += od; I += inc; return {...r, dep, od, inc, run}; });
  const dash = '<span class="dash">—</span>', v = (x, c) => x ? `<td class="num r ${c}">${fmt(x)}</td>` : `<td class="r">${dash}</td>`;
  $("banks").innerHTML = `<div class="totals">
      <div><span>${esc(t("totDep"))}</span><b class="num plus">${fmt(D)}</b></div>
      <div><span>${esc(t("totOrd"))}</span><b class="num minus">${fmt(O)}</b></div>
      <div><span>${esc(t("fromIncT"))}</span><b class="num">${fmt(I)}</b></div>
      <div class="key"><span>${esc(t("bankBal"))}</span><b class="num">${fmt(run)}</b></div>
    </div>
    <div class="tbl"><table>
    <thead><tr><th>${esc(t("date"))}</th><th class="r">${esc(t("deposit"))}</th><th class="r">${esc(t("ordAmt"))}</th><th class="r">${esc(t("fromInc"))}</th><th class="r">${esc(t("balance"))}</th><th class="hn">${esc(t("notes"))}</th></tr></thead><tbody>` +
    lines.map(r=>`<tr><td class="num">${esc(r.date)}</td>${v(r.dep,"plus")}${v(r.od,"minus")}${v(r.inc,"")}
      <td class="num r"><b>${fmt(r.run)}</b></td><td class="n hn">${esc(r.notes||"")}</td></tr>`).join("") +
    `<tr class="last"><td>${esc(t("total"))}</td><td class="num r">${fmt(D)}</td><td class="num r">${fmt(O)}</td><td class="num r">${fmt(I)}</td>
      <td class="num r">${fmt(run)}</td><td class="hn"></td></tr></tbody></table></div>
    <div class="foot">${esc(t("bankNote"))}</div>`;
}

/* ---------------- navigation + period ---------------- */
function showList(){ cur = null; $("vst").classList.add("hide"); $("vlist").classList.remove("hide"); renderList(); }
function showSt(){ $("vlist").classList.add("hide"); $("vst").classList.remove("hide"); renderSt(); window.scrollTo(0,0); }
$("bk").onclick = showList;
window.addEventListener("popstate", ()=>{ if (cur != null) showList(); });
pickIn("qbx", "r", v => {
  range = v;
  $("rng").classList.toggle("hide", range !== "custom");
  if (range === "custom" && !$("df").value){
    const d = new Date(); $("dt").value = d.toISOString().slice(0,10);
    $("df").value = new Date(d.getFullYear(), d.getMonth(), 1, 12).toISOString().slice(0,10);
  }
  renderSt();
});
$("df").onchange = $("dt").onchange = renderSt;
function bounds(){
  if (range === "month"){ const d = new Date(); return [new Date(d.getFullYear(), d.getMonth(), 1, 12).toISOString().slice(0,10), "9999-12-31"]; }
  if (range === "custom") return [$("df").value || "0000-01-01", $("dt").value || "9999-12-31"];
  return ["0000-01-01", "9999-12-31"];
}
function renderSt(){
  const m = data && data.ms.find(x=>x.id===cur); if (!m) return;
  $("sname").textContent = m.name;
  $("smeta").innerHTML = `<span class="num">${esc(m.code)}</span>${m.region ? "  |  " + esc(m.region) : ""}`;
  $("sbal").textContent = fmt(m.bal); $("sbal").classList.toggle("neg", m.bal < 0);
  $("pOp").textContent = fmt(m.op); $("pIn").textContent = fmt(m.inc); $("pUs").textContent = fmt(m.used);
  const bk = lastBank(m.id); $("pBkw").classList.toggle("hide", !bk); if (bk) $("pBk").textContent = fmt(bk.balance);
  $("spaper").classList.toggle("hide", !m.bad);
  $("spaper").textContent = t("paperBad") + (m.note ? " — " + m.note : "");
  const cnt = n => n ? String(n) : "";
  $("cO").textContent = cnt(new Set(extra.orders.filter(r=>r.merchant_id===m.id).map(r=>r.kind+(r.doc_no||r.id))).size);
  $("cI").textContent = cnt(extra.invoices.filter(r=>r.merchant_id===m.id).length);
  $("cD").textContent = cnt((extra.merchant_docs||[]).filter(r=>r.merchant_id===m.id).length);
  const [a,b] = bounds(), dated = pane === "st" || pane === "ord";
  $("qbx").classList.toggle("hide", !dated);
  $("rng").classList.toggle("hide", range !== "custom" || !dated);
  $("txs").classList.toggle("hide", pane !== "st");
  $("pord").classList.toggle("hide", pane !== "ord");
  $("pinv").classList.toggle("hide", pane !== "inv");
  $("pbank").classList.toggle("hide", pane !== "bank");
  $("pdoc").classList.toggle("hide", pane !== "doc");
  if (pane === "ord") return renderOrders(m, a, b);
  if (pane === "inv") return renderInv(m);
  if (pane === "bank") return renderBank(m);
  if (pane === "doc") return renderDocs(m);
  let before = 0, add = 0, used = 0; const rows = [];
  for (const r of m.tx){
    if (r.date < a) before = r.balance;
    else if (r.date <= b){ rows.push(r); r.type === "usage" ? used += r.amount : add += r.amount; }
  }
  const end = rows.length ? rows[rows.length-1].balance : before;
  // ملاحظة الرفع (اسم الملف) مالهاش لازمة للمشرف — نعرض الملاحظات الحقيقية بس
  const note = n => { n = String(n||"").trim(); return (/\.(xlsx|xlsm|xls|csv)\b/i.test(n) || /^(بواقي|حوافز|مستخدم)\s*-/.test(n)) ? "" : n; };
  const dash = '<span class="dash">—</span>';
  $("txs").innerHTML = `<div class="tbl"><table>
    <thead><tr><th>${esc(t("date"))}</th><th>${esc(t("type"))}</th><th class="r">${esc(t("added"))}</th><th class="r">${esc(t("used"))}</th><th class="r">${esc(t("balance"))}</th><th class="hn">${esc(t("notes"))}</th></tr></thead><tbody>
    <tr class="edge"><td colspan="4">${esc(t("openBal"))}</td><td class="num r">${fmt(before)}</td><td class="hn"></td></tr>` +
    rows.map(r=>`<tr>
      <td class="num">${esc(r.date)}</td><td class="k">${esc(TYPE_KEY[r.type] ? t(TYPE_KEY[r.type]) : r.type)}</td>
      <td class="num r plus">${r.type!=="usage"?fmt(r.amount):dash}</td>
      <td class="num r minus">${r.type==="usage"?fmt(r.amount):dash}</td>
      <td class="num r"><b>${fmt(r.balance)}</b></td><td class="n hn">${esc(note(r.notes))}</td></tr>`).join("") +
    (rows.length ? "" : `<tr><td colspan="6" class="n" style="text-align:center;padding:18px">${esc(t("noTx"))}</td></tr>`) +
    `<tr class="last"><td colspan="2">${esc(t("endBal"))}</td><td class="num r">${fmt(add)}</td><td class="num r">${fmt(used)}</td>
      <td class="num r">${fmt(end)}</td><td class="hn"></td></tr></tbody></table></div>`;
}

boot();
</script>
